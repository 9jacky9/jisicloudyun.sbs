<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我们 - 极速Cloud</title>
  <style>
    :root { --navy: #0A192F; --blue: #00E5FF; --orange: #FF5722; --white: #FFFFFF; --border: 4px solid var(--navy); }
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: var(--white); color: var(--navy); line-height: 1.6; overflow-x: hidden; }
    h1, h2, h3, h4 { text-transform: uppercase; font-weight: 900; letter-spacing: 1px; margin-top: 0; }
    p { font-size: 1.1rem; font-weight: 500; }
    a { text-decoration: none; }
    .section { padding: 80px 20px; position: relative; }
    .container { max-width: 1200px; margin: 0 auto; }
    .card { border: var(--border); background: var(--white); color: var(--navy); padding: 40px; box-shadow: 12px 12px 0 var(--navy); position: relative; margin-bottom: 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: var(--border); background: var(--white); }
    .logo { display: flex; align-items: center; font-size: 1.5rem; font-weight: 900; gap: 10px; color: var(--navy); text-decoration: none; }
    
    .footer { background: var(--navy); color: var(--white); padding: 60px 20px; text-align: center; border-top: 8px solid var(--blue); }
    .footer-links { margin-top: 30px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
    .footer-links a { color: var(--blue); font-weight: bold; font-size: 1.1rem; border-bottom: 2px solid transparent; padding-bottom: 2px; transition: border-color 0.2s; }
    .footer-links a:hover { border-color: var(--blue); }
    .section-title { font-size: clamp(2rem, 4vw, 3rem); text-align: center; margin-bottom: 40px; }
  
    @media (max-width: 768px) {
      .header { padding: 10px 15px !important; flex-wrap: wrap; justify-content: space-between !important; gap: 10px; }
      .logo { font-size: 1.2rem !important; }
      .nav-menu { display: contents; }
      .nav-links { order: 3; width: 100%; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; margin-top: 5px; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 15px !important; display: flex !important; flex-direction: row !important; }
      .nav-links::-webkit-scrollbar { display: none; }
      .header .btn { order: 2; padding: 8px 15px !important; font-size: 0.9rem !important; margin: 0 !important; }
    }
</style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" width="40" height="24">
        <path d="M 20 45 L 30 25 L 50 15 L 70 25 L 90 20 L 95 40 L 80 55 L 30 55 Z" fill="#0A192F" stroke="#00E5FF" stroke-width="4"/>
        <polygon points="40,55 50,35 70,35 60,55" fill="#00E5FF"/>
      </svg>
      极速CLOUD
    </a>
  </header>
  <section class="section">
    <div class="container" style="max-width: 800px;">
      <h1 class="section-title">关于极速Cloud</h1>
      <div class="card">
        <h3 style="font-size: 1.5rem; margin-bottom: 20px;">我们的愿景</h3>
        <p style="margin-bottom: 20px;">极速Cloud 创立于技术前沿，致力于为全球用户提供无限制、高对比度、极致性能的网络加速服务。我们的团队由深耕网络安全和传输优化的顶级工程师组成。</p>
        <h3 style="font-size: 1.5rem; margin-bottom: 20px; margin-top: 40px;">打破数字边界，连接未来</h3>
        <p>我们坚信，未来的网络体验应当如呼吸般顺畅。为此，我们重新构建了底层路由架构，抛弃冗余的传统协议，打造真正符合现代高强度网络需求的产品。</p>
      </div>
    </div>
  </section>
  <footer class="footer">
    <div class="container">
      <div class="logo" style="justify-content: center; color: var(--white);">
        <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" width="40" height="24">
          <path d="M 20 45 L 30 25 L 50 15 L 70 25 L 90 20 L 95 40 L 80 55 L 30 55 Z" fill="#FFFFFF" stroke="#00E5FF" stroke-width="4"/>
          <polygon points="40,55 50,35 70,35 60,55" fill="#00E5FF"/>
        </svg>
        极速CLOUD
      </div>
      <p style="margin-top: 20px;">构建属于未来的无界网络。</p>
      <div class="footer-links">
        <a href="sitemap.html">网站地图</a>
        <a href="about.html">关于我们</a>
        <a href="terms.html">服务条款</a>
        <a href="privacy.html">隐私政策</a>
      </div>
      <p style="margin-top: 40px; font-size: 0.9rem; opacity: 0.7;">&copy; 2026 极速Cloud. 保留所有权利。</p>
    </div>
  </footer>
</body>
</html>
